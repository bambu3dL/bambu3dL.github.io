# Pubblica il sito su GitHub Pages a ogni modifica del ramo principale.
# Anche le modifiche fatte dall'area riservata (che sono commit) rimettono online il sito: servono circa 1-2 minuti.
name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # Si lavora sulla copia nella cartella di pubblicazione: il repository resta com'è.
      - name: Prepara index.html
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # Gli indirizzi assoluti delle anteprime dei link (og:image, canonical) seguono il dominio vero, anche quando cambia.
          sed -i "s|__SITE_URL__|${BASE_URL%/}|g" public/index.html
          # Moduli precaricati in parallelo invece che a catena (vedi tools/preload.mjs).
          node tools/preload.mjs public
      # GitHub Pages non riscrive le rotte: un indirizzo come /gallery darebbe 404. Con un 404.html uguale a
      # index.html il sito si apre lo stesso e il router interno mostra la pagina giusta (e la pagina "non trovata").
      - name: Prepara 404.html
        run: cp public/index.html public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
